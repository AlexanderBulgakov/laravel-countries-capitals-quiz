x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - ./src:/var/www/html
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${POSTGRES_DB:-laravel}
    DB_USERNAME: ${POSTGRES_USER:-laravel}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    REDIS_HOST: valkey
    REDIS_PORT: 6379
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
  depends_on:
    db:
      condition: service_healthy
    valkey:
      condition: service_started

services:
  app:
    <<: *php
    healthcheck:
      test: ["CMD-SHELL", "test -f vendor/autoload.php && grep -q '^APP_KEY=base64:' .env"]
      interval: 5s
      start_period: 5m
      retries: 3

  queue:
    <<: *php
    command: php artisan queue:work --sleep=3 --max-time=3600
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laravel}
      POSTGRES_USER: ${POSTGRES_USER:-laravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  db_data:
